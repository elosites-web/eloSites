        {

          "@id": "https://elosites.ia.br/#website",
          "url": "https://elosites.ia.br",
          "name": "ēloSites | Estúdio de Desenvolvimento Web",
          "description": "Desenvolvimento de landing pages e sites institucionais responsivos com estrutura organizada para mecanismos de busca e integração com WhatsApp.",

        {
          "@type": "FAQPage",
          "@id": "https://elosites.ia.br/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Preciso ter todo o conteúdo pronto?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. Na conversa inicial e na reunião de materiais, organizamos juntos o que já existe — fotos, textos, serviços e identidade. Se faltar alguma coisa, alinhamos o que é essencial para o site ir ao ar com qualidade."
              }
            },
            {
              "@type": "Question",
              "name": "Quanto tempo leva para o site ficar pronto?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Depende do formato (landing page ou site institucional) e de quanto tempo leva para reunir conteúdos e fotos. O processo é pensado para ser rápido, em dias em vez de meses — sem um prazo absoluto, porque cada projeto tem o próprio ritmo de revisão."
              }
            },
            {
              "@type": "Question",
              "name": "Quanto custa e como é o pagamento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Cada projeto tem seu escopo específico, então o valor é definido em um orçamento sob medida após entendermos seu modelo de negócio e necessidades. Para o pagamento, oferecemos 4 modalidades flexíveis: 1) 50% de entrada no início e 50% na entrega e aprovação final (via PIX); 2) 20% de desconto para pagamento integral à vista no fechamento; 3) Até 5x sem juros no cartão de crédito (1 entrada + 4 parcelas fixas); ou 4) Parcelamento estendido de 6x até 12x no cartão de crédito (com repasse das taxas de juros da operadora). Fale com a gente pelo WhatsApp para receber sua proposta detalhada."
              }
            },
            {
              "@type": "Question",
              "name": "A publicação e a hospedagem estão inclusas?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A ēloSites cuida da publicação inicial e de todas as configurações técnicas previstas no escopo contratado. Eventuais custos recorrentes de hospedagem e recursos adicionais são informados com total transparência no orçamento antes do início, sem promessa de gratuidade ou inclusão permanente de serviços pagos."
              }
            },
            {
              "@type": "Question",
              "name": "O domínio personalizado está incluso?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Quando incluído no orçamento do projeto, a ēloSites realiza a contratação e o registro do domínio utilizando os dados de CPF ou CNPJ do próprio cliente, mediante autorização, além de configurar os servidores DNS. O custo do registro varia conforme o período escolhido e é repassado e discriminado no orçamento. A renovação do domínio é periódica, e as condições ficam detalhadas no orçamento e na documentação de entrega."
              }
            },
            {
              "@type": "Question",
              "name": "Depois do projeto eu continuo tendo controle do site?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Na conclusão do projeto, você recebe os arquivos, o repositório, as informações de publicação, os acessos e as orientações necessárias para administrar a infraestrutura entregue, com o domínio registrado em seu CPF ou CNPJ."
              }
            },
            {
              "@type": "Question",
              "name": "Existe manutenção mensal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, e é opcional — o valor é definido em 20% sobre o valor do orçamento do seu projeto, conforme o plano de manutenção combinado. Cobre até 4 solicitações simples por mês (troca de textos, fotos, telefones, links e pequenos ajustes visuais), sem acúmulo entre meses. Novas páginas, recursos exclusivos e mudanças estruturais são orçados à parte. Não inclui anuidade de domínio nem outros servidores."
              }
            }
